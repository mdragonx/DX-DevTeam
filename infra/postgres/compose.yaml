services:
  postgres:
    image: postgres:17.6-alpine@sha256:115e3985a7957c3b89feafeda24f040ec86bf55f417b15a0f6aad8e9a314d176
    environment:
      POSTGRES_DB: dxdevteam
      POSTGRES_USER: dxdevteam
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dxdevteam -d dxdevteam"]
      interval: 5s
      timeout: 3s
      retries: 10
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
